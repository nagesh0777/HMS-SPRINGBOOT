services:
  db:
    image: mysql:8.0
    container_name: trikaar-db
    restart: unless-stopped
    command: >
      --innodb-buffer-pool-size=64M --performance_schema=OFF --max_connections=50
    environment:
      TZ: Asia/Kolkata
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: trikaar_emr
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    mem_limit: 350m

  backend:
    build: ./backend-java
    container_name: trikaar-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: Asia/Kolkata
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/trikaar_emr?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate only validates
      # that entities match it at startup. Was "update" here, silently overriding the
      # validate-only default in application.properties and re-enabling live auto-DDL
      # against a database holding patient records.
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JAVA_OPTS: "-XX:MaxRAMPercentage=65.0 -Xms128m -Xmx280m -Xss512k -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
      # No fallback: a committed default here would let anyone who has ever read this repo
      # (or its git history) mint a valid session token for any user in any hospital tenant.
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      APP_JWT_EXPIRATION_MS: 86400000
      SMTP_USERNAME: croctechconnect@gmail.com
      APP_MAIL_FROM: croctechconnect@gmail.com
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 450m

  frontend:
    build: ./frontend-modern
    container_name: trikaar-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hms-frontend.rule=Host(`hms.trikaar.tech`)"
      - "traefik.http.routers.hms-frontend.entrypoints=websecure"
      - "traefik.http.routers.hms-frontend.tls=true"
      - "traefik.http.routers.hms-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.hms-frontend.loadbalancer.server.port=80"
      # Traefik Rate Limiting Middleware (100 req/s, burst 50)
      - "traefik.http.middlewares.hms-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.hms-ratelimit.ratelimit.burst=50"
      # Traefik Security Headers Middleware
      - "traefik.http.middlewares.hms-headers.headers.sslredirect=true"
      - "traefik.http.middlewares.hms-headers.headers.browserXSSFilter=true"
      - "traefik.http.middlewares.hms-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.hms-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.hms-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.hms-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.hms-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.hms-headers.headers.frameDeny=true"
      # Attach Middlewares to Router
      - "traefik.http.routers.hms-frontend.middlewares=hms-ratelimit,hms-headers"
    mem_limit: 80m

volumes:
  mysql_data:
  uploads_data:
