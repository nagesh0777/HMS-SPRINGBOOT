
server.port=8080
spring.application.name=TrikaarEMR

# Datasource Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/trikaar_emr?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA
# validate, never update. Flyway owns the schema; Hibernate's job is to fail loudly at startup
# if the entities and the migrated schema disagree, rather than silently ALTERing a live database
# holding patient records.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
# Deliberately false: with it on, Flyway marks an existing non-empty database as already
# baselined and skips pending migrations, so a drifted database would silently never migrate.
# The live database predates Flyway, so its first deploy needs a one-off baseline — see
# DEPLOYING.md — after which this stays off.
spring.flyway.baseline-on-migrate=false
spring.jpa.show-sql=false

# JWT Configuration
# No fallback. A committed default signing key means anyone who reads this repository can mint a
# valid token for any user in any hospital, without a password and without a failed-login record.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# File Upload Configuration
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Razorpay Subscription Checkout
# Keep mock mode enabled until live/test Razorpay keys are configured on the server.
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_add_your_key}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.mock-mode=${RAZORPAY_MOCK_MODE:true}

# Gmail OTP Sender
# Generate a Gmail App Password for croctechconnect@gmail.com and set GMAIL_APP_PASSWORD.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:croctechconnect@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${APP_MAIL_FROM:croctechconnect@gmail.com}
app.demo.recipient=${APP_DEMO_RECIPIENT:croctechconnect@gmail.com}

# ── Performance ─────────────────────────────────────────────────────────────
# Connection pool. The Hikari default of 10 is generous for one instance but the timeouts are
# not: without max-lifetime below the database's wait_timeout, MySQL closes connections the pool
# still believes are good, and the first request to reuse one fails with a broken pipe.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:25}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=hms-pool

# Batch inserts and updates. Without batch_size every row in a save-all is its own round trip;
# order_inserts lets Hibernate group them so the batching actually applies.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Read-ahead for collections, so a list of parents does not fetch children one at a time.
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# open-in-view keeps a database connection held for the whole request including view rendering,
# which quietly caps throughput at the pool size. Off; anything lazily loaded must be fetched
# inside the service layer where it belongs.
spring.jpa.open-in-view=false

# Response compression — JSON patient lists compress well and this is the cheapest latency win
# available on a slow connection.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# Graceful shutdown so in-flight clinical requests finish rather than erroring during a deploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
