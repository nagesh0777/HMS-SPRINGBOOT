name: 🚀 Deploy Trikaar HMS to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:   # Allow manual trigger from GitHub UI

env:
  VPS_HOST: 72.61.242.209
  VPS_USER: root
  DEPLOY_PATH: /opt/hms-springboot

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout the latest code
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # 2. Setup SSH key for VPS access
      - name: 🔑 Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # 3. Add VPS to known_hosts (prevents host key prompt)
      - name: 🌐 Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts

      # 4. Sync source code to VPS (exclude build artifacts, node_modules, etc.)
      - name: 📤 Sync Code to VPS
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'target' \
            --exclude '.idea' \
            --exclude '*.iml' \
            --exclude 'frontend-modern/dist' \
            --exclude '.env.local' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.DEPLOY_PATH }}/

      # 5. Build and restart containers on VPS
      - name: 🐳 Build & Restart Docker Containers
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF'
            set -e
            cd ${{ env.DEPLOY_PATH }}
            echo "🔧 Building and restarting containers..."
            docker compose up --build -d
            echo "✅ Waiting for containers to be healthy..."
            sleep 10
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          EOF

      # 6. Health check — verify the app responds
      - name: 🏥 Health Check
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 http://${{ env.VPS_HOST }}:8085 || echo "000")
          echo "Frontend HTTP status: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
            echo "✅ App is live and responding!"
          else
            echo "⚠️  App returned status $STATUS — check VPS logs"
            exit 1
          fi

      # 7. Notify on success
      - name: 🎉 Deployment Complete
        if: success()
        run: |
          echo "✅ Trikaar HMS deployed successfully!"
          echo "🌐 Live at: https://hms.trikaar.tech"

      # 8. Notify on failure
      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above."
