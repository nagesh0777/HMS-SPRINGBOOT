# Tests run against in-memory H2 so the suite needs no MySQL and leaves nothing behind.
spring.datasource.url=jdbc:h2:mem:hmstest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.jwt.secret=test-only-signing-secret-not-used-anywhere-real-0123456789abcdef
app.jwt.expirationMs=3600000
